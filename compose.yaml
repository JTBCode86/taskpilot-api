services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}
    volumes:
      - sql_data:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      - db
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}
    volumes:
      - ./src/Banco de dados:/scripts:ro
      - ./docker/db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/bash", "/db-init.sh"]
    restart: "no"

  api:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TaskPilotDBConnection: "Server=db,1433;Database=TaskPilotDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: ${TASKPILOT_JWT_KEY:-}
      RateLimiting__Auth__LoginPermitLimit: "1000"
      RateLimiting__Auth__RegisterPermitLimit: "1000"
      Observability__Otlp__Enabled: ${TASKPILOT_OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: TaskPilot.API
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "127.0.0.1:${TASKPILOT_API_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  aspire-dashboard:
    image: mcr.microsoft.com/aspire/dashboard:13
    profiles: ["observability"]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:${TASKPILOT_DASHBOARD_PORT:-18888}:18888"

  frontend:
    profiles: ["frontend"]
    build:
      context: ./src/taskpilot_frontend
    environment:
      TASKPILOT_PROXY_TARGET: http://api:8080
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: frontend
    ports:
      - "127.0.0.1:${TASKPILOT_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  sql_data:
